# Singapore host Nginx; install only after issuing the certificate below.
server {
    listen 80;
    server_name resumeworkflow.com www.resumeworkflow.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/resume-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://resumeworkflow.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.resumeworkflow.com;
    ssl_certificate /etc/letsencrypt/live/resumeworkflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumeworkflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://resumeworkflow.com$request_uri;
}

server {
    listen 443 ssl;
    server_name resumeworkflow.com;
    ssl_certificate /etc/letsencrypt/live/resumeworkflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumeworkflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
