<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>登录 · Resume</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-mark">r.</span><span>resume.</span></a><h1>让每一份经历，都有归处。</h1><p class="login-subtitle">登录后，在不同设备继续维护你的素材、模板和简历。</p>
<div class="auth-tabs" role="group" aria-label="账号操作"><button type="button" data-mode="sms" aria-pressed="true">手机登录</button><button type="button" data-mode="password" aria-pressed="false">邮箱登录</button><button type="button" data-mode="register">注册账号</button></div>
<form id="login-form" class="account-form">
<div id="registration-kind-row" hidden><label for="registration-kind">验证方式</label><select id="registration-kind"><option value="email">邮箱验证</option><option value="phone">手机验证</option></select></div>
<div id="identifier-row"><label for="identifier">用户名或邮箱</label><input id="identifier" autocomplete="username" maxlength="254" required></div>
<div id="username-row" hidden><label for="new-username">用户名</label><input id="new-username" autocomplete="username" minlength="3" maxlength="32" placeholder="以字母开头，3～32 位"><small>支持字母、数字、点、下划线和短横线。</small></div>
<div id="email-row" hidden><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="用于接收注册验证码"></div>
<div id="email-code-row" hidden><label for="email-code">邮箱验证码</label><div class="code-input"><input id="email-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"><button class="button" id="send-email-code" type="button">发送验证码</button></div><small>验证码 5 分钟内有效，注册后可用用户名或邮箱登录。</small><p id="email-status" class="account-message" role="status"></p></div>
<div id="phone-row" hidden><label for="phone">中国大陆手机号（+86）</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" pattern="1[3-9][0-9]{9}" maxlength="11"></div>
<div id="sms-code-row" hidden><label for="sms-code">短信验证码</label><div class="code-input"><input id="sms-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"><button class="button" id="send-sms-code" type="button">发送验证码</button></div><small>5 分钟内有效。手机登录首次验证通过后自动创建账号。</small><p id="sms-status" class="account-message" role="status"></p></div>
<p id="sms-unavailable" class="account-note" hidden>短信服务暂不可用，请使用密码登录。</p>
<div id="password-row"><label id="password-label" for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required></div>
<div id="confirm-row" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></div>
<div id="legacy-row" class="legacy-notice" hidden><label><input id="keep-legacy" type="checkbox" checked> 将此浏览器原有的素材、模板和简历绑定到新账号</label><p>原文件保持不变，绑定后可用新账号继续访问。</p></div>
<p id="email-unavailable" class="account-note" hidden>邮箱注册服务暂不可用，已有账号可正常登录。</p><p id="auth-message" class="account-message" role="status"></p><button class="button primary account-submit" id="auth-submit" type="submit">登录</button>
</form><div class="login-footer"><a href="/" class="login-home">先逛逛首页</a><button id="forgot-password" type="button">忘记密码？</button></div><p class="account-note" id="recovery-note" hidden>忘记密码请联系管理员协助重置。</p></main><script type="module" src="login.js?v=20261010-three"></script></body></html>
